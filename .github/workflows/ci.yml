name: Model utility tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install numpy torch
      - run: python -m compileall -q src scripts tests
      - run: python tests/test_model_ema.py
